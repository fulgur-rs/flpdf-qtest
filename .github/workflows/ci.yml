name: qtest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      flpdf_ref:
        description: "flpdf branch / tag / SHA (default: main)"
        required: false
        default: main
  schedule:
    # Nightly regression sweep against flpdf main HEAD.
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: qtest-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  qtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout flpdf-qtest
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve flpdf ref
        id: flpdf_ref
        env:
          INPUT_REF: ${{ inputs.flpdf_ref }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ref="${INPUT_REF:-}"
          if [[ -z "${ref}" && "${EVENT_NAME}" == "pull_request" && -n "${HEAD_REF}" ]]; then
            # Cross-repository companion PRs use the same branch name in
            # flpdf. Prefer that branch when it exists so an unmerged helper
            # can be tested before the flpdf PR lands; ordinary qtest PRs
            # continue against flpdf main when no matching branch exists.
            if git ls-remote --exit-code --heads \
                https://github.com/fulgur-rs/flpdf.git "refs/heads/${HEAD_REF}" >/dev/null 2>&1; then
              ref="${HEAD_REF}"
            fi
          fi
          ref="${ref:-main}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout flpdf
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: fulgur-rs/flpdf
          ref: ${{ steps.flpdf_ref.outputs.ref }}
          path: flpdf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Install Python deps
        # vl-convert-python is needed by plot-metrics.py and its unit test;
        # PyYAML by the action contract test.
        run: python3 -m pip install vl-convert-python PyYAML

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            flpdf/target
          key: cargo-${{ runner.os }}-${{ steps.flpdf_ref.outputs.ref }}-${{ hashFiles('flpdf/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.flpdf_ref.outputs.ref }}-
            cargo-${{ runner.os }}-

      - name: Unit tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      # One implementation of the survey, exercised here before flpdf
      # consumes it. verify-ledger keeps this repository's own data gates --
      # allowlist.txt and parity/qtest-11.9.0.jsonl -- which an external
      # caller does not have and judges against its own baseline instead.
      - name: Run qtest survey
        uses: ./
        with:
          flpdf-dir: flpdf
          survey-dir: survey/latest
          verify-ledger: "true"

  # Nightly only: append the run's metrics to the metrics-data history branch
  # and re-render the trend chart. Isolated from the qtest job so that job keeps
  # contents:read; this one needs contents:write to push. Best-effort.
  publish-metrics:
    needs: qtest
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read  # download-artifact from the qtest job
    steps:
      - name: Checkout flpdf-qtest
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The push to metrics-data happens in a throwaway clone with its own
          # GH_TOKEN auth, so this checkout never needs persisted credentials.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Install Python deps
        run: python3 -m pip install vl-convert-python

      - name: Download qtest metrics
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qtest-results
          path: artifacts

      - name: Publish metrics to metrics-data branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-metrics.sh artifacts/qtest-metrics.jsonl artifacts/qtest-parity-metrics.jsonl
