name: qtest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      flpdf_ref:
        description: "flpdf branch / tag / SHA (default: main)"
        required: false
        default: main
  schedule:
    # Nightly regression sweep against flpdf main HEAD.
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: qtest-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  qtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout flpdf-qtest
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve flpdf ref
        id: flpdf_ref
        env:
          INPUT_REF: ${{ inputs.flpdf_ref }}
        run: |
          ref="${INPUT_REF:-main}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout flpdf
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: fulgur-rs/flpdf
          ref: ${{ steps.flpdf_ref.outputs.ref }}
          path: flpdf

      - name: Resolve flpdf SHA
        id: flpdf_sha
        run: echo "sha=$(git -C flpdf rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Install Python deps
        # vl-convert-python is needed by plot-metrics.py and its unit test.
        run: python3 -m pip install vl-convert-python

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            flpdf/target
          key: cargo-${{ runner.os }}-${{ steps.flpdf_ref.outputs.ref }}-${{ hashFiles('flpdf/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.flpdf_ref.outputs.ref }}-
            cargo-${{ runner.os }}-

      - name: Unit tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      # Select by binary name, not package name: the binary names are what the
      # harness consumes, while flpdf's crate layout is free to change.
      - name: Build flpdf, flpdf-test-compare and flpdf-test-driver
        working-directory: flpdf
        run: cargo build --release --bin flpdf --bin flpdf-test-compare --bin flpdf-test-driver

      - name: Run qtest acceptance suite
        env:
          FLPDF_CLI_BIN: ${{ github.workspace }}/flpdf/target/release/flpdf
          FLPDF_TEST_COMPARE_BIN: ${{ github.workspace }}/flpdf/target/release/flpdf-test-compare
          FLPDF_TEST_DRIVER_BIN: ${{ github.workspace }}/flpdf/target/release/flpdf-test-driver
          FLPDF_COMMIT: ${{ steps.flpdf_sha.outputs.sha }}
        run: ./scripts/run.sh

      - name: Upload qtest artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qtest-results
          path: |
            harness.log
            qtest.log
            qtest-summary.md
            qtest-metrics.jsonl
          if-no-files-found: ignore

  # Nightly only: append the run's metrics to the metrics-data history branch
  # and re-render the trend chart. Isolated from the qtest job so that job keeps
  # contents:read; this one needs contents:write to push. Best-effort.
  publish-metrics:
    needs: qtest
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read  # download-artifact from the qtest job
    steps:
      - name: Checkout flpdf-qtest
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The push to metrics-data happens in a throwaway clone with its own
          # GH_TOKEN auth, so this checkout never needs persisted credentials.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Install Python deps
        run: python3 -m pip install vl-convert-python

      - name: Download qtest metrics
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qtest-results
          path: artifacts

      - name: Publish metrics to metrics-data branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-metrics.sh artifacts/qtest-metrics.jsonl
